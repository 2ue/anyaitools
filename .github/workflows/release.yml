name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish from the selected branch
        required: true
        type: string

env:
  RELEASE_VERSION_INPUT: ${{ inputs.version }}

jobs:
  # ============================================================================
  # 阶段 1: 构建校验与桌面产物发布
  # ============================================================================

  build-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.6'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace versions
        run: pnpm verify:versions

      - name: Verify npm publish packages
        run: pnpm verify:publish-packages

      - name: Build packages (exclude desktop)
        run: pnpm build

      - name: Resolve release version
        id: version
        run: |
          VERSION="$RELEASE_VERSION_INPUT"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify version match
        run: |
          CLI_VERSION=$(node -p "require('./packages/cli/package.json').version")
          TAG_VERSION="${{ steps.version.outputs.VERSION }}"

          if [ "$CLI_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch!"
            echo "Tag: $TAG_VERSION"
            echo "CLI: $CLI_VERSION"
            exit 1
          fi

  build-desktop-mac:
    needs: publish-npm
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.6'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Types module
        run: |
          cd packages/types
          pnpm build

      - name: Build Core module
        run: |
          cd packages/core
          pnpm build

      - name: Build Desktop app
        run: |
          cd packages/desktop
          pnpm build

      - name: Package for macOS
        run: |
          cd packages/desktop
          pnpm build:electron:ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Resolve release version
        id: version
        run: |
          VERSION="$RELEASE_VERSION_INPUT"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifacts to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.dmg.blockmap
            packages/desktop/release/*.zip
            packages/desktop/release/*-mac.yml
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-win:
    needs: build-desktop-mac
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.6'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # 使用镜像加速 Electron 下载，避免超时
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Build Types module
        run: |
          cd packages/types
          pnpm build

      - name: Build Core module
        run: |
          cd packages/core
          pnpm build

      - name: Build Desktop app
        run: |
          cd packages/desktop
          pnpm build

      - name: Package for Windows
        run: |
          cd packages/desktop
          pnpm build:electron:ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="$RELEASE_VERSION_INPUT"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload Windows artifacts to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.exe.blockmap
            packages/desktop/release/latest.yml
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # 阶段 2: 发布 npm 包
  # ============================================================================

  publish-npm:
    needs: build-cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve release version
        id: version
        run: |
          VERSION="$RELEASE_VERSION_INPUT"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.11.0'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Pin npm 11.5.1 for OIDC trusted publishing
        run: npm install -g npm@11.5.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace versions
        run: pnpm verify:versions

      - name: Verify npm publish packages
        run: pnpm verify:publish-packages

      - name: Build packages (exclude desktop)
        run: pnpm build

      - name: Verify publish version match
        run: |
          CLI_VERSION=$(node -p "require('./packages/cli/package.json').version")
          AICODING_VERSION=$(node -p "require('./packages/aicoding/package.json').version")
          TAG_VERSION="${{ steps.version.outputs.VERSION }}"

          if [ "$CLI_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch!"
            echo "Tag: $TAG_VERSION"
            echo "CLI: $CLI_VERSION"
            exit 1
          fi

          if [ "$AICODING_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch!"
            echo "Tag: $TAG_VERSION"
            echo "aicoding: $AICODING_VERSION"
            exit 1
          fi

      - name: Prepare CLI package for publishing
        run: |
          cd packages/cli
          # 备份原始 package.json
          cp package.json package.json.bak
          # 删除 @anyaitools/core workspace 依赖（源码已编译到 dist）
          node -e "
            const pkg = require('./package.json');
            if (pkg.name !== '@vebing-tools/anyaitools') {
              throw new Error('Unexpected CLI package name: ' + pkg.name);
            }
            delete pkg.dependencies['@anyaitools/core'];
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Publish @vebing-tools/anyaitools CLI
        run: |
          cd packages/cli
          PACKAGE='@vebing-tools/anyaitools'
          VERSION='${{ steps.version.outputs.VERSION }}'
          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE}@${VERSION} already published, skip"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @vebing-tools/aicoding
        run: |
          cd packages/aicoding
          PACKAGE='@vebing-tools/aicoding'
          VERSION='${{ steps.version.outputs.VERSION }}'
          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE}@${VERSION} already published, skip"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Restore original package.json
        if: always()
        run: |
          cd packages/cli
          mv package.json.bak package.json

  # ============================================================================
  # 阶段 3: 更新 GitHub Release 元信息
  # ============================================================================

  create-release:
    needs: build-desktop-win
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION="$RELEASE_VERSION_INPUT"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        id: release_notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          {
            echo 'content<<EOF'
            echo "AnyAI Tools ${VERSION} release."
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Update GitHub Release notes
        uses: softprops/action-gh-release@v2
        with:
          name: AnyAI Tools ${{ steps.version.outputs.VERSION }}
          body: |
            ## 📝 更新内容

            ${{ steps.release_notes.outputs.content }}

            ---

            ## 📦 npm 包已发布

            - [@vebing-tools/anyaitools@${{ steps.version.outputs.VERSION }}](https://www.npmjs.com/package/@vebing-tools/anyaitools)
            - [@vebing-tools/aicoding@${{ steps.version.outputs.VERSION }}](https://www.npmjs.com/package/@vebing-tools/aicoding)

            ## 📥 CLI 安装

            ```bash
            npm install -g @vebing-tools/anyaitools
            ```

            ## 🚀 CLI 使用

            ```bash
            # 进入交互式菜单
            aat

            # 管理 Codex 服务商
            aat cx

            # 管理 Claude Code 服务商
            aat cc
            ```

            ## 🖥️ Desktop 应用下载

            ### macOS
            - **Intel (x64)**: `AnyAI-Tools-${{ steps.version.outputs.VERSION }}-macos-x64.dmg`
            - **Apple Silicon (ARM64)**: `AnyAI-Tools-${{ steps.version.outputs.VERSION }}-macos-arm64.dmg`
            - **Universal (Intel + Apple Silicon)**: `AnyAI-Tools-${{ steps.version.outputs.VERSION }}-macos-universal.dmg`

            下载对应的 `.dmg` 文件，双击安装即可。

            ### Windows
            - **64-bit**: `AnyAI-Tools-${{ steps.version.outputs.VERSION }}-windows-x64.exe`

            下载 `.exe` 文件，双击安装即可。

            ---

          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
